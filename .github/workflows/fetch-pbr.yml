# 地面の PBR 素材（assets/data/pbr）を Poly Haven（CC0）から取得して、そのブランチにコミットします。
# scripts/fetch-pbr.mjs を変えて push したとき、または Actions タブから手動で実行できます。
name: Fetch PBR ground textures
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/fetch-pbr.mjs', '.github/workflows/fetch-pbr.yml']
concurrency:
  group: fetch-pbr-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-pbr.mjs
      - name: Commit textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/pbr
          git diff --cached --quiet && exit 0
          git commit -m "地面の PBR 素材を更新（Poly Haven, CC0）"
          git push
